# Update pull requests for every ecosystem in the repository, monthly.
#
# The CI scans block a push on a known HIGH or CRITICAL advisory in what ships; this is the
# other half — it proposes the upgrades, including for the build tools the scans leave out.
#
# Three rules, the same for every ecosystem:
#   - Monthly. A portfolio demo does not need a weekly review queue. Except the Dockerfile's
#     base images, weekly: see there.
#   - No major versions. Each is a migration (Spring Boot 4, Java 25, PostgreSQL 18), done
#     on purpose, by hand, not proposed by a bot on a schedule. Security fixes in a newer
#     major are still caught: the CI scans fail on them.
#   - One pull request per ecosystem. Majors being ignored, the group "everything" is
#     exactly "minor and patch" — and, for the Docker images, the digest refreshes, which
#     carry no version number for a minor/patch filter to match.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      backend:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      frontend:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']

  # docker-compose.yml pins MinIO by digest. Dependabot proposes the new digest when the
  # image is rebuilt, which is the only way a pinned digest ever moves forward.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      compose-images:
        patterns: ['*']

  # backend/Dockerfile pins both base images (Maven build, Temurin JRE) by digest.
  #
  # Weekly, the one exception to monthly: this is what ships, and the image scan blocks CI
  # on it. Monthly let it fall behind in October 2026. The run that the config change made
  # on the 18th found nothing new; the fixed Temurin image appeared on the 21st, CI failed
  # from the 20th, and the next monthly run was a month away. Alpine's own fixes are
  # applied in the Dockerfile (apk upgrade), but the JRE is not an Alpine package: a Java
  # security release reaches the image only through a new digest, so only this picks it up.
  #
  # The JDK stays on 21, the release the application targets, in both images. A change of
  # Java major is a migration, like the others above, so it is never proposed. New digests
  # still are: that is how Maven 3.9.x and JDK 21.0.x fixes arrive, the tags being floating.
  #
  # The semver-major rule does not see a JDK change in the build image. Dependabot reads
  # "3.9-eclipse-temurin-21" as version 3.9.21 (the JDK becomes the third number), so moving
  # to "-26" looks like a patch, 3.9.26, and PR #12 proposed it. Hence version ranges: each
  # excludes every JDK above 21 for one Maven minor and lets 21 itself through. A Maven minor
  # on 21 ("3.10-eclipse-temurin-21", 3.10.21) is still proposed. Add a line when Maven 3.11
  # appears.
  #
  # The runtime image's tag reads as the JDK itself ("21-jre-alpine" is 21), so a new JDK
  # is a major and the first rule already stops it. It is named too, so that does not
  # depend on the wildcard staying.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'maven'
        versions: ['>= 3.9.22, < 3.10', '>= 3.10.22, < 3.11']
      - dependency-name: 'eclipse-temurin'
        versions: ['>= 22']
    groups:
      dockerfile-images:
        patterns: ['*']
