name: frontend

# Mirrors the backend workflow: every push on every branch, plus pull requests into main,
# filtered to the paths that can affect the result. frontend/openapi.json is in the list
# because the API client is generated from it — a refreshed contract changes the generated
# types, which can break compilation here without a single line of Angular changing.
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  # Weekly, whatever has been pushed: an advisory published on Tuesday about a dependency
  # nobody touched should not wait for the next commit to be noticed.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: install, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Pinned to the minimum Angular 22 accepts, not to "lts/*": a runner image
          # rolling forward to a Node major Angular has not qualified is a red build with
          # no commit behind it. Keep this in step with the `engines` field in package.json.
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API client is generated by openapi-generator, which is a Java program behind an
      # npm wrapper. That is the cost of using the canonical, best-supported generator for
      # Angular rather than a lighter TypeScript-native one — and the JVM is already a
      # first-class dependency of this repository, so it is a cost worth paying here.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      # `npm ci`, not `npm install`: it installs exactly the lock file and fails if the
      # lock file and package.json disagree, which is what CI should do.
      - name: Install
        run: npm ci

      # Known vulnerabilities in what reaches a browser: the production dependencies.
      # The build tools are left out of the gate on purpose — the API client generator
      # pulls in a dependency chain with open advisories that never ships, and failing on
      # it would only teach everyone to ignore this step. Dependabot reports those.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Explicit, though lint/build/test each trigger it through their pre-scripts. Doing
      # it once up front means a generator failure is reported as a generator failure
      # rather than as three identical "cannot find module '../api'" compile errors.
      - name: Generate the API client
        run: npm run api:generate

      - name: Lint
        run: npm run lint

      # The security policy and headers are written into the site by scripts/build.mjs;
      # its rules are tested here, with the runtime that runs it.
      - name: Test the build scripts
        run: npm run test:scripts

      # Production configuration: optimisation, budgets and locale inlining all on. A
      # development build would pass while the thing that ships does not. No AUTOX_*
      # variables, so the policy allows this origin only — the build also fails here if
      # it ever emits inline script that policy would block.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --no-watch

      - name: Upload build output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
