name: backend

# Every push, on every branch, plus pull requests into the default branch (named both ways:
# the repository is on master today, and main is where it is likely to end up). The suite is the only thing
# standing between a change and production, so it runs on all of them rather than on a
# curated list of branches somebody has to remember to update.
#
# Path-filtered now that frontend/ exists: an Angular-only change should not pay for the
# backend's integration tests and five minutes of containers. Two of the paths are deliberately not
# under backend/:
#
#   frontend/openapi.json — the committed API contract the frontend generates its client
#     from. OpenApiSnapshotTest compares it against the live document, so a snapshot
#     refreshed without the backend change behind it has to fail here.
#   this workflow file    — so a change to the job that runs the tests is itself tested.
on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/openapi.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/openapi.json'
      - '.github/workflows/backend.yml'
  # Weekly, whatever has been pushed: an advisory published on Tuesday about a dependency
  # nobody touched should not wait for the next commit to be noticed.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant. Cancelling it
# keeps the queue honest about what is actually being tested.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    # The suite starts real containers; it takes minutes, not seconds. The cap is here so a
    # stuck image pull fails in half an hour instead of holding a runner for six.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Keyed on the pom by the action itself, so a dependency change invalidates it.
          cache: maven

      # Not a setup step — an assertion. Every test in this suite talks to a real
      # PostgreSQL and a real S3-compatible store through Testcontainers, so a runner
      # without a working Docker daemon cannot run any of them. Checking here fails with
      # the actual reason instead of hundreds of identical ExceptionInInitializerErrors.
      - name: Check Docker is available
        run: docker info --format 'Docker {{.ServerVersion}}'

      # clean, deliberately: maven copies resources without removing ones that have been
      # renamed, so an incremental build can keep loading a stale application.yml and run
      # the whole suite against the wrong configuration. That exact thing happened in
      # development — see docs/test-config-decisions.md.
      #
      # `verify` rather than `test`: it also packages the application, so a build that
      # cannot produce a runnable jar fails here rather than at deploy time.
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      # The image Render deploys, built from the Dockerfile here: a Dockerfile that no
      # longer builds fails this check rather than the deploy, which waits for it.
      - name: Build the container image
        run: docker build -t autox-api:ci .

      # Known vulnerabilities in what ships: the image — its Alpine packages and the
      # libraries in it — not the pom, which would mean resolving it again against Maven
      # Central, which rate-limits scanners. HIGH and CRITICAL with a fixed version
      # available fail the build; an advisory with no fix cannot be acted on by a version
      # bump and is reported elsewhere (Dependabot) rather than blocking every push.
      #
      # Trivy runs from its image, pinned by digest: a scanner that pulls whatever was
      # published last is itself a supply-chain risk. It reads the image from a saved
      # archive rather than the Docker socket, so it is handed nothing it could act on.
      # Findings judged not to apply are in backend/.trivyignore, each with its reason.
      - name: Scan the image for known vulnerabilities
        run: |
          mkdir -p target/scan
          docker save autox-api:ci -o target/scan/autox-api.tar
          docker run --rm \
            -v "$PWD/target/scan:/scan:ro" \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /scan/autox-api.tar --timeout 15m \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1

      # Surefire's XML is the only place the actual assertion failure is written down. The
      # log above is truncated and interleaved; without this a red run says "tests failed"
      # and nothing else.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14
