name: mobile

# The Flutter app in mobile/. Same shape as the backend and frontend workflows: every push,
# pull requests into main, filtered to what can change the result. The frontend files in the list
# are the ones the app is built or tested from: openapi.json (the Dart client is generated from
# it), openapitools.json (the generator version, which must match), labels.fr.json (the French
# words), fixtures/ (the test vectors both clients must reproduce) and _tokens.scss (the colours).
#
# A `mobile-v*` tag also runs the release job: a signed APK on a GitHub Release named after the
# tag. Path filters do not apply to tags (GitHub's rule), so every such tag is built. See
# mobile/README.md, "Publishing a release".
on:
  push:
    branches: ['**']
    tags: ['mobile-v*']
    paths:
      - 'mobile/**'
      - 'frontend/openapi.json'
      - 'frontend/openapitools.json'
      - 'frontend/labels.fr.json'
      - 'frontend/fixtures/**'
      - 'frontend/src/styles/_tokens.scss'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - 'frontend/openapi.json'
      - 'frontend/openapitools.json'
      - 'frontend/labels.fr.json'
      - 'frontend/fixtures/**'
      - 'frontend/src/styles/_tokens.scss'
      - '.github/workflows/mobile.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: generate, format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      # Exactly the version in C:\src\flutter, the development machine's only install, and in
      # pubspec.yaml's `environment.flutter`. The three move together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # openapi-generator is a Java program; the same version as the web's client.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache the generator jar
        uses: actions/cache@v5
        with:
          path: mobile/.dart_tool/openapi-generator
          key: openapi-generator-${{ hashFiles('mobile/tool/generate_api.mjs') }}

      # Before anything that compiles: analyze and test run against what this generates from the
      # committed spec and labels, never against a stale copy. The step fails — and the job with
      # it — when the generator version differs from the web's, the spec does not validate, the
      # generator reports anything about the spec not on the script's known list, one of its
      # fixes no longer applies, or the generated client does not compile. See the script.
      - name: Generate the API client and the labels
        run: node tool/generate_api.mjs

      - name: Dependencies match the lock file
        run: flutter pub get --enforce-lockfile

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # A debug build proves the Android side (manifests, Gradle, plugins) still assembles.
      # Unsigned and thrown away; the release build is the tag-only job below.
      - name: Build a debug APK
        run: flutter build apk --debug

  release:
    name: signed release APK
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The one job that writes: it creates the GitHub Release.
    permissions:
      contents: write
    # One release per tag at a time, never cancelled halfway through publishing.
    concurrency:
      group: mobile-release-${{ github.ref }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache the generator jar
        uses: actions/cache@v5
        with:
          path: mobile/.dart_tool/openapi-generator
          key: openapi-generator-${{ hashFiles('mobile/tool/generate_api.mjs') }}

      # mobile-v1.2.3 → versionName 1.2.3, versionCode 10203; a tag that does not fit fails here.
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: node tool/release_version.mjs "$TAG" >> "$GITHUB_OUTPUT"

      # Repository variables, not secrets: two addresses and a public fingerprint. Checked before
      # the build, which would otherwise succeed and give an app that refuses to start.
      - name: Release configuration is set
        env:
          AUTOX_API_BASE_URL: ${{ vars.AUTOX_API_BASE_URL }}
          AUTOX_SITE_URL: ${{ vars.AUTOX_SITE_URL }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          missing=0
          for name in AUTOX_API_BASE_URL AUTOX_SITE_URL ANDROID_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings, Secrets and variables, Actions, Variables)."
              missing=1
            fi
          done
          for name in AUTOX_API_BASE_URL AUTOX_SITE_URL; do
            if [ -n "${!name}" ] && [ "${!name#https://}" = "${!name}" ]; then
              echo "::error::$name must start with https://."
              missing=1
            fi
          done
          # The origin only: the app's paths already start with /api/v1/.
          case "$AUTOX_API_BASE_URL" in
            */api|*/api/|*/api/v1|*/api/v1/)
              echo "::error::AUTOX_API_BASE_URL is the server's address alone, without /api/v1."
              missing=1 ;;
          esac
          exit $missing

      - name: Generate the API client and the labels
        run: node tool/generate_api.mjs

      - name: Dependencies match the lock file
        run: flutter pub get --enforce-lockfile

      # Into the runner's temporary directory, outside the checkout; removed by the last step
      # whatever happens. Nothing here is echoed, and the runner masks secrets in any case.
      - name: Keystore from the secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autox-release.jks"

      # One universal APK (every ABI), signed with the release key: android/app/build.gradle.kts
      # reads the ANDROID_* variables, and AUTOX_REQUIRE_RELEASE_SIGNING turns its debug-key
      # fallback into a failure. Flutter's default shrinking applies.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AUTOX_API_BASE_URL: ${{ vars.AUTOX_API_BASE_URL }}
          AUTOX_SITE_URL: ${{ vars.AUTOX_SITE_URL }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/autox-release.jks"
          export AUTOX_REQUIRE_RELEASE_SIGNING=true
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=AUTOX_API_BASE_URL="$AUTOX_API_BASE_URL" \
            --dart-define=AUTOX_SITE_URL="$AUTOX_SITE_URL"
          mkdir -p "$RUNNER_TEMP/release"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/release/autox-$VERSION_NAME.apk"

      # The signature must verify, with exactly one signer, and that signer's SHA-256 must be the
      # certificate the repository names (ANDROID_CERT_SHA256, as keytool prints it: colons and
      # case do not matter). A wrong keystore in the secret fails here, before anything is
      # published: an APK signed with another key could never update the installed app.
      - name: Verify the signature and its certificate
        env:
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          apk="$RUNNER_TEMP/release/autox-$VERSION_NAME.apk"
          certs="$("$apksigner" verify --print-certs "$apk")"
          signers="$(printf '%s\n' "$certs" | grep -c 'certificate SHA-256 digest:' || true)"
          if [ "$signers" != "1" ]; then
            echo "::error::Expected exactly one signer, found $signers."
            exit 1
          fi
          actual="$(printf '%s\n' "$certs" | sed -n 's/.*certificate SHA-256 digest: *//p' | tr -d ' :' | tr 'A-F' 'a-f')"
          expected="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ' :' | tr 'A-F' 'a-f')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is signed by $actual, not by ANDROID_CERT_SHA256 ($expected)."
            exit 1
          fi
          echo "Signed by the release certificate $actual."

      - name: Checksum
        working-directory: ${{ runner.temp }}/release
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: sha256sum "autox-$VERSION_NAME.apk" > "autox-$VERSION_NAME.apk.sha256"

      - name: Publish the GitHub Release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "AutoX for Android, version $VERSION_NAME (code $VERSION_CODE). Installing it and checking its SHA-256: mobile/README.md, \"Publishing a release\"." \
            "autox-$VERSION_NAME.apk" \
            "autox-$VERSION_NAME.apk.sha256"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/autox-release.jks"
