# The site on Netlify. docs/deployment.md, step 5, is the full procedure.
#
# Only the build is described here. The security headers and the single-page fallback are
# written into the published folder by `npm run build` (scripts/build.mjs) as _headers and
# _redirects, because the Content-Security-Policy has to name the API and the storage
# origins, which are only known at build time. Nothing in this file repeats them.
#
# The three AUTOX_* build variables (API, storage, site URL) are set in the Netlify UI, not
# here: they name this deployment's services, and the same commit should build for another.

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to base.
  publish = "dist/frontend/browser"
  # Runs from the base directory; 0 skips the build, anything else builds it. Three rules:
  #   - every context but production is skipped: no deploy previews, no branch deploys;
  #   - a production build of the commit already built runs: that is a manual rebuild, the only
  #     way a changed build variable reaches the site;
  #   - otherwise production builds only if something under frontend/ changed, which is
  #     Netlify's own default, restated because this command replaces it. A commit that changes
  #     only this file does not rebuild either: trigger one by hand (docs/deployment.md, step 6).
  #     Commits it cannot compare build.
  # frontend/scripts/deploy-config.test.mjs runs this line against a real repository.
  ignore = '''[ "$CONTEXT" != production ] || { [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ; } || exit 1'''

[build.environment]
  # CI's version: the October 2026 security release of Node 24. Keep the two in step.
  NODE_VERSION = "24.22.1"
