# The official Flutter set, made strict. `flutter analyze` must report nothing: CI fails on
# infos as well as warnings (`--fatal-infos`).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by tool/generate_api.mjs; its own analysis options apply there.
    - packages/**
    - build/**
    - android/**
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_type_to_string
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters

# `dart format` reads this. 120, not 80: the codebase's other languages wrap near there, and
# Flutter's nested constructors spend most of an 80-column line on indentation.
formatter:
  page_width: 120
