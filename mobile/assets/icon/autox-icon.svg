<?xml version="1.0" encoding="UTF-8"?>
<!-- The AutoX launcher icon: a two-tone X on white. The "\" stroke is the site's accent blue
     (the c-accent token), whole; the "/" stroke is near-black, cut by a thin white gap where it
     passes under the blue one.

     Drawn on Android's adaptive icon canvas: 108 units, of which the launcher shows at least the
     central 66-unit circle. The X spans 33 to 75 on both axes, so its corners sit 30 units from
     the centre, inside that circle. Both strokes are 12 units wide along the horizontal and run
     corner to corner; the gap is 2.2 units on each side of the blue stroke, measured square to
     it.

     The source of every launcher file: tool/generate_icon.mjs reads the rect's fill and each
     path's fill and data (absolute M, L and Z only), and writes the Android resources from
     them. Edit here, then run it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect id="background" width="108" height="108" fill="#ffffff"/>
  <path id="slash" fill="#111111" d="M63 33L75 33L61.35 52.11L55.35 43.71ZM52.65 64.29L45 75L33 75L46.65 55.89Z"/>
  <path id="backslash" fill="#0057ff" d="M33 33L45 33L75 75L63 75Z"/>
</svg>
