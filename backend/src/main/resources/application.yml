# Configuration comes from the environment, and from a .env file at the repository root
# which DotenvEnvironmentPostProcessor loads at startup — the same file docker compose
# reads, so there is one place to configure a local machine and nothing to export by hand.
# A real environment variable always wins over .env, so CI and production are unaffected.
#
# Non-secret coordinates below carry a local default that matches docker-compose, so the
# application starts against a stock local stack. CREDENTIALS DELIBERATELY HAVE NO DEFAULT:
# a default password is a password in version control, and one that works locally is one
# that reaches a server eventually. Those are listed in RequiredSetting.all(), which fails
# startup naming the variable instead of letting Hikari assert about a URL.
spring:
  application:
    name: autox-backend

  datasource:
    # Defaults match the docker-compose service: port 5433 because a natively installed
    # PostgreSQL owns 5432 and the connection would silently reach the wrong server.
    url: ${AUTOX_DB_URL:jdbc:postgresql://localhost:5433/autox}
    username: ${AUTOX_DB_USERNAME:autox}
    # No default. See the header.
    password: ${AUTOX_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${AUTOX_DB_POOL_SIZE:10}
      # How many connections stay open while nothing is happening, and for how long an
      # unused one is kept. Locally: the whole pool, for ten minutes — Hikari's defaults.
      # Against a database that scales to zero (Neon), 0 and a minute: an open connection
      # is pinged every two minutes to keep it alive, and those pings alone would keep
      # the database awake around the clock and spend its monthly compute allowance.
      minimum-idle: ${AUTOX_DB_POOL_MIN_IDLE:${AUTOX_DB_POOL_SIZE:10}}
      idle-timeout: ${AUTOX_DB_IDLE_TIMEOUT_MS:600000}
      pool-name: autox-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    problemdetails:
      enabled: true

  # One server language. Validation `message` text is developer-facing; clients render
  # end-user text from `code` and `field`, in the user's own language.
  web:
    locale: en
    locale-resolver: fixed

  messages:
    always-use-message-format: false
    fallback-to-system-locale: false

server:
  port: ${AUTOX_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # Who the client is, behind a proxy. Every throttle keys on this, so it decides whether
  # the rate limits can be dodged.
  #
  # `native`: Tomcat's RemoteIpValve, which believes a forwarding header only when the
  # connection comes from an internal proxy (by default the private ranges: 10/8,
  # 172.16/12, 192.168/16, 100.64/10, loopback and their IPv6 equivalents), and reads it
  # from the RIGHT, skipping hops it trusts. Not `framework`: that takes the first value of
  # X-Forwarded-For, which is whatever the client wrote — most proxies, Render's included,
  # append to the header rather than replace it, so a forged first value went straight
  # through and every caller could pick their own throttle key.
  #
  # Which header carries the client is the deployment's to say. X-Forwarded-For is right
  # behind a single proxy that appends. Render puts Cloudflare in front of its own proxy,
  # so the rightmost untrusted hop there is a Cloudflare edge, shared by thousands of
  # visitors; Render sets True-Client-IP to the real client, overwriting any value the
  # client sent, and that is what AUTOX_CLIENT_IP_HEADER names there. See
  # docs/deployment.md for the check to run once deployed.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: ${AUTOX_CLIENT_IP_HEADER:X-Forwarded-For}

autox:
  auth:
    # HS256 signing key, base64 or raw text, minimum 32 bytes. No default on purpose.
    jwt-secret: ${AUTOX_JWT_SECRET}
    issuer: ${AUTOX_JWT_ISSUER:https://api.autox.local}
    access-token-ttl: PT15M
    refresh-token-ttl: P90D
    # Mobile sessions are long-lived, so a refresh token is rotated on every use
    # and replaying a rotated one revokes its whole family.
    rotate-refresh-tokens: true

    # Progressive delay, not a hard lock: the account cap is deliberately low so
    # deliberate failures cannot keep the real owner out.
    login-throttle:
      enabled: ${AUTOX_LOGIN_THROTTLE_ENABLED:true}
      # Failures 1-4 are free; the 5th waits 30s, then 1m, 2m, 4m, 8m, capped at 15m.
      account-threshold: 4
      account-initial-delay: PT30S
      account-max-delay: PT15M
      # Per-address, catching a spray across many accounts. Higher threshold because a
      # shared office address is legitimately noisier than one account.
      ip-threshold: 20
      ip-initial-delay: PT1M
      ip-max-delay: PT30M
      reset-after: PT24H

    # Registration is the one unauthenticated endpoint that writes a row and hashes a
    # password, so it is capped per client address: every attempt counts, successful or
    # not. Five an hour is far beyond a household and far below a script.
    registration-throttle:
      enabled: ${AUTOX_REGISTRATION_THROTTLE_ENABLED:true}
      max-attempts-per-window: ${AUTOX_REGISTRATION_MAX_ATTEMPTS:5}
      window: PT1H

    # A reset link is a bearer credential sitting in an inbox, so it is short-lived and
    # single-use. Both caps exist because the caller need not own the address they submit:
    # one stops the endpoint being used to bury someone's inbox, the other bounds a sweep
    # across many addresses.
    password-reset:
      ttl: PT30M
      max-requests-per-window: 3
      max-requests-per-address-per-window: 20
      window: PT1H

  mail:
    # `log` writes the message to the application log instead of sending it. That makes the
    # reset flow walkable in development and is a credential leak in production: a real
    # provider adds a value here and an EmailSender bean conditional on it.
    provider: ${AUTOX_MAIL_PROVIDER:log}
    from-address: ${AUTOX_MAIL_FROM:no-reply@autox.local}
    from-name: ${AUTOX_MAIL_FROM_NAME:AutoX}
    # The frontend page that takes the token, which the email links to with ?token=…
    # The API cannot guess it: the web app is deployed separately. The path is French
    # because every URL the user sees is — it must match the Angular route exactly, since a
    # mismatch produces a link that reaches the app and renders nothing.
    password-reset-url: ${AUTOX_PASSWORD_RESET_URL:http://localhost:4200/reinitialiser-mot-de-passe}

  public-api:
    # Per-IP limit on the unauthenticated GETs (search, listing detail, reference).
    # Sized to be invisible to a real visitor: 300 a minute is five a second sustained,
    # where a fast browsing session is nearer one. Exceeding it is a scraper.
    rate-limit:
      enabled: ${AUTOX_PUBLIC_RATE_LIMIT_ENABLED:true}
      requests-per-window: ${AUTOX_PUBLIC_RATE_LIMIT_REQUESTS:300}
      window: PT1M
      block-for: PT1M

  # How often the background sweeps run. Each touches the database, so on a database that
  # scales to zero each run is a wake-up; a demo with nothing to expire can run them a few
  # times a day. Durations for the two interval sweeps, a Spring cron for the hourly one.
  scheduling:
    listing-expiry-interval: ${AUTOX_SCHEDULE_LISTING_EXPIRY:PT10M}
    image-cleanup-interval: ${AUTOX_SCHEDULE_IMAGE_CLEANUP:PT15M}
    auth-maintenance-cron: ${AUTOX_SCHEDULE_AUTH_MAINTENANCE:0 17 * * * *}
    # A HEAD on the bucket. Reports a storage outage that starts after startup, and keeps a
    # free Supabase project from pausing for inactivity (see StorageReadinessCheck).
    storage-check-interval: ${AUTOX_SCHEDULE_STORAGE_CHECK:PT12H}

  listing:
    # A published listing stays live for this long, then the sweeper expires it.
    # Renewing resets the window from the moment of renewal.
    expiry-days: 60
    # Simultaneous ACTIVE listings. 0 = unlimited; dealers are uncapped until
    # subscription tiers exist. Overridable per account via app_user.active_listing_limit.
    particulier-active-limit: 5
    professionnel-active-limit: 0

  storage:
    endpoint: ${AUTOX_S3_ENDPOINT:}
    region: ${AUTOX_S3_REGION:us-east-1}
    bucket: ${AUTOX_S3_BUCKET:autox-images}
    access-key: ${AUTOX_S3_ACCESS_KEY}
    secret-key: ${AUTOX_S3_SECRET_KEY}
    path-style-access: ${AUTOX_S3_PATH_STYLE:false}
    public-base-url: ${AUTOX_S3_PUBLIC_BASE_URL:}
    # Long enough for a large photo on a poor mobile connection, short enough that an
    # intercepted URL is not a lasting write capability.
    upload-url-ttl: PT15M
    read-url-ttl: PT6H
    create-bucket-if-missing: ${AUTOX_S3_CREATE_BUCKET:false}

  images:
    max-per-listing: 20
    # 10 MB. A modern phone photo is 3-6 MB; variants mean the original is never served.
    max-bytes: 10485760
    # Narrower than the database allows: the JDK decodes JPEG and PNG without a plugin,
    # and accepting a format we cannot resize would produce listings with no gallery.
    allowed-content-types:
      - image/jpeg
      - image/png
    min-dimension: 400
    variant-max-edge:
      THUMBNAIL: 320
      CARD: 800
      FULL: 1600
    jpeg-quality: 0.82

# Health only, and only a status. Everything actuator can expose about an instance —
# environment, configuration properties, bean graph, heap dumps, log levels — is either
# a credential or a map of the system, so the exposure list is an allow-list of one.
management:
  endpoints:
    web:
      exposure:
        include: health
      # Not under /api, so it is never caught by the API's CORS, rate limit or auth rules.
      base-path: /actuator
  endpoint:
    health:
      # No component breakdown, no database vendor, no disk figures: a load balancer needs
      # UP or DOWN, and anything more tells an anonymous caller about the deployment.
      show-details: never
      show-components: never
      # Registers the livenessState and readinessState indicators the groups below use.
      probes:
        enabled: true
      # Two signals, not one. Liveness answers "is this process alive" — a load balancer
      # that restarts an instance merely waiting on the database makes an outage worse.
      # Readiness answers "can it serve", which here means it can reach PostgreSQL.
      #
      # Object storage is deliberately absent from both. Authentication, listings and
      # search do not need it, so an S3 outage should degrade image upload rather than
      # take every instance out of rotation — the same call StorageReadinessCheck makes
      # by logging instead of failing startup.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.autox: ${AUTOX_LOG_LEVEL:INFO}
    org.flywaydb: INFO
