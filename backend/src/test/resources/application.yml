# Test-only configuration. This file is `application.yml` on the test classpath, which
# comes before the main one, so it does not merge with it — it REPLACES it. Anything the
# tests need from the production configuration has to be repeated here, which is why the
# datasource placeholders and the management block below exist.
#
# The datasource values below are placeholders: the
# Testcontainers @ServiceConnection supplies the real ones at runtime. They exist
# so the main profile's ${AUTOX_DB_*} placeholders have something to resolve to
# without requiring a developer's environment to be set up to run tests.
spring:
  datasource:
    url: jdbc:postgresql://localhost:1/replaced-by-testcontainers
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false

autox:
  auth:
    # Test-only signing key. Never used outside the test source set.
    jwt-secret: test-only-signing-key-at-least-32-bytes-long-0123456789
    issuer: https://api.autox.test
    access-token-ttl: PT15M
    refresh-token-ttl: P90D
    rotate-refresh-tokens: true
    # Same thresholds as production, but seconds instead of minutes, so escalation is
    # observable without the suite sleeping. The policy arithmetic is asserted separately
    # against the production numbers.
    login-throttle:
      enabled: true
      account-threshold: 4
      account-initial-delay: PT1S
      account-max-delay: PT2S
      ip-threshold: 20
      ip-initial-delay: PT1S
      ip-max-delay: PT2S
      reset-after: PT24H

    # Production policy as-is. Expiry is tested by ageing expires_at with SQL rather than
    # by shortening the TTL and sleeping — the same approach the rate-limit tests take.
    password-reset:
      ttl: PT30M
      max-requests-per-window: 3
      max-requests-per-address-per-window: 20
      window: PT1H

  mail:
    provider: log
    password-reset-url: https://autox.test/reset-password

  # Off by default across the suite. Every test shares one client address (MockMvc always
  # reports 127.0.0.1), so a suite-wide limit would couple unrelated test classes to each
  # other's request counts. PublicRateLimitIntegrationTest switches it on for itself.
  public-api:
    rate-limit:
      enabled: false
      requests-per-window: 300
      window: PT1M
      block-for: PT1M

  # A cap of 2 keeps the quota tests fast; the production default is 5.
  listing:
    expiry-days: 60
    particulier-active-limit: 2
    professionnel-active-limit: 0

  # Storage endpoint and credentials come from the MinIO container, via
  # @DynamicPropertySource in AbstractIntegrationTest.
  images:
    # 3 rather than 20, so the per-listing cap can be reached in three calls.
    max-per-listing: 3
    max-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
    min-dimension: 400
    variant-max-edge:
      THUMBNAIL: 320
      CARD: 800
      FULL: 1600
    jpeg-quality: 0.82

# Must mirror the production block: HealthEndpointIntegrationTest asserts both the shape
# of the response and that nothing else is exposed, and would otherwise be asserting
# actuator's defaults rather than this application's configuration.
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    com.autox: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.springframework.security: WARN
