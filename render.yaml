# Render Blueprint for the API. The database (Neon), photo storage (Cloudflare R2) and the
# site (Cloudflare Pages) are not on Render; docs/deployment.md is the full procedure.
#
# Values marked `sync: false` are secrets or depend on the other services: Render asks for
# them once, when the Blueprint is first applied, and never reads them from this file.
# Changing them later is done in the dashboard (Environment), not here.
services:
  - type: web
    name: autox-api
    runtime: docker
    plan: free
    # Frankfurt: next to Neon's and R2's European regions, and to the site's audience.
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Only a backend change redeploys the API, and only once CI has passed on the commit.
    buildFilter:
      paths:
        - backend/**
    autoDeployTrigger: checksPass
    # Liveness, not /actuator/health: Render checks every few seconds, and the full health
    # check queries PostgreSQL — which would keep Neon awake around the clock.
    healthCheckPath: /actuator/health/liveness
    envVars:
      # ---- secrets and values from the other services ----
      - key: AUTOX_DB_URL                  # Neon, converted to JDBC form (see the guide)
        sync: false
      - key: AUTOX_DB_USERNAME             # Neon
        sync: false
      - key: AUTOX_DB_PASSWORD             # Neon
        sync: false
      - key: AUTOX_S3_ENDPOINT             # R2: https://<account id>.r2.cloudflarestorage.com
        sync: false
      - key: AUTOX_S3_ACCESS_KEY           # R2 API token
        sync: false
      - key: AUTOX_S3_SECRET_KEY           # R2 API token
        sync: false
      - key: AUTOX_CORS_ALLOWED_ORIGINS    # the Pages site: https://<project>.pages.dev
        sync: false
      - key: AUTOX_PASSWORD_RESET_URL      # https://<project>.pages.dev/reinitialiser-mot-de-passe
        sync: false
      - key: AUTOX_JWT_ISSUER              # this service's URL: https://<service>.onrender.com
        sync: false
      # A random 256-bit key, generated by Render once and kept.
      - key: AUTOX_JWT_SECRET
        generateValue: true

      # ---- fixed for these four services ----
      - key: AUTOX_S3_REGION
        value: auto
      - key: AUTOX_S3_BUCKET
        value: autox-photos
      - key: AUTOX_S3_PATH_STYLE
        value: "true"
      - key: AUTOX_S3_CREATE_BUCKET
        value: "false"
      # Render overwrites this header with the real client; X-Forwarded-For's last
      # untrusted hop there is a Cloudflare edge. See application.yml, server.
      - key: AUTOX_CLIENT_IP_HEADER
        value: True-Client-IP
      - key: AUTOX_LOG_LEVEL
        value: INFO

      # ---- sized for 512 MB and for a database that scales to zero ----
      - key: AUTOX_DB_POOL_SIZE
        value: "5"
      - key: AUTOX_DB_POOL_MIN_IDLE
        value: "0"
      - key: AUTOX_DB_IDLE_TIMEOUT_MS
        value: "60000"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "20"
      - key: AUTOX_SCHEDULE_LISTING_EXPIRY
        value: PT6H
      - key: AUTOX_SCHEDULE_IMAGE_CLEANUP
        value: PT6H
      - key: AUTOX_SCHEDULE_AUTH_MAINTENANCE
        value: "0 17 */6 * * *"

      # ---- demo ----
      # Ten years: the default sixty days would expire every seeded listing two months in.
      - key: AUTOX_LISTING_EXPIRYDAYS
        value: "3650"
      # Dealers are uncapped by default, and anyone can register as one.
      - key: AUTOX_LISTING_PROFESSIONNELACTIVELIMIT
        value: "3"
