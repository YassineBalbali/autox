# Local development database only. Credentials come from .env (copy .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: autox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autox}
      POSTGRES_USER: ${POSTGRES_USER:-autox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation, so ORDER BY behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - autox-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autox} -d ${POSTGRES_DB:-autox}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  autox-pgdata:
