<!-- ===== Hero: a short search over a full-width photo ===================== -->
<section class="hero" aria-labelledby="hero-title">
  <!-- Decorative: it shows a street of cars and says nothing the headline does not. The
       source and licence are in docs/third-party-assets.md. -->
  <div class="hero__backdrop" aria-hidden="true">
    <img
      class="hero__photo"
      src="/images/hero-street-1920.jpg"
      srcset="/images/hero-street-1280.jpg 1280w, /images/hero-street-1920.jpg 1920w"
      sizes="100vw"
      alt=""
      fetchpriority="high"
      decoding="async"
    />
  </div>

  <div class="hero__inner">
    <app-home-finder />

    <div class="hero__headline">
      <h1 id="hero-title" class="hero__title" i18n="@@homeTitle">L’occasion, en toute clarté</h1>
      <p class="hero__lede" i18n="@@homeLede">
        Des voitures de particuliers et de professionnels, avec le prix, l’année et le kilométrage bien en vue.
      </p>
    </div>
  </div>
</section>
